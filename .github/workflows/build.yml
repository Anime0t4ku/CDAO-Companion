name: Build cdrdao

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-14

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config build-essential git

      - name: Install macOS build dependencies
        if: startsWith(matrix.target, 'macos-')
        run: brew install autoconf automake libtool pkg-config

      - name: Build
        env:
          TARGET_NAME: ${{ matrix.target }}
        run: bash scripts/build-unix.sh

      - name: Package
        env:
          TARGET_NAME: ${{ matrix.target }}
        run: bash scripts/package.sh

      - uses: actions/upload-artifact@v6
        with:
          name: cdrdao-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          pattern: cdrdao-*
          path: dist
          merge-multiple: true

      - name: Build manifest and checksums
        run: python3 scripts/make-manifest.py

      - name: Verify release assets
        run: |
          test -f "dist/cdrdao-$(cat UPSTREAM_VERSION)-linux-x64.tar.gz"
          test -f "dist/cdrdao-$(cat UPSTREAM_VERSION)-linux-arm64.tar.gz"
          test -f "dist/cdrdao-$(cat UPSTREAM_VERSION)-macos-x64.tar.gz"
          test -f "dist/cdrdao-$(cat UPSTREAM_VERSION)-macos-arm64.tar.gz"
          test -f dist/manifest.json
          test -f dist/SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat UPSTREAM_VERSION)"
          TAG="cdrdao-${VERSION}"
          TITLE="cdrdao ${VERSION} for MiSTer Companion"
          NOTES="cdrdao ${VERSION} builds for MiSTer Companion on Linux and macOS."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              dist/*
          fi
