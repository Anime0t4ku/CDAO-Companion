name: Reusable cdrdao build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-14

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config build-essential git

      - name: Install macOS build dependencies
        if: startsWith(matrix.target, 'macos-')
        run: brew install autoconf automake libtool pkg-config

      - name: Build
        env:
          TARGET_NAME: ${{ matrix.target }}
        run: bash scripts/build-unix.sh

      - name: Package
        env:
          TARGET_NAME: ${{ matrix.target }}
        run: bash scripts/package.sh

      - uses: actions/upload-artifact@v6
        with:
          name: cdrdao-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
