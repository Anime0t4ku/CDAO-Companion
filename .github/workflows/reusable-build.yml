name: Reusable cdrdao build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6
      - if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config build-essential git
      - if: startsWith(matrix.target, 'macos-')
        run: brew install autoconf automake libtool pkg-config
      - env:
          TARGET_NAME: ${{ matrix.target }}
        run: bash scripts/build-unix.sh
      - env:
          TARGET_NAME: ${{ matrix.target }}
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v6
        with:
          name: cdrdao-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  windows-x64:
    runs-on: windows-2025
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: autoconf automake libtool make git python
          pacboy: toolchain:p libiconv:p
      - shell: msys2 {0}
        env:
          TARGET_NAME: windows-x64
          HOST_TRIPLET: x86_64-w64-mingw32
        run: bash scripts/build-windows.sh
      - shell: msys2 {0}
        env:
          TARGET_NAME: windows-x64
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v6
        with:
          name: cdrdao-windows-x64
          path: dist/*
          if-no-files-found: error

  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            autoconf automake libtool make git python
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-libc++
            mingw-w64-clang-aarch64-lld
            mingw-w64-clang-aarch64-make
            mingw-w64-clang-aarch64-pkgconf
            mingw-w64-clang-aarch64-libiconv
      - shell: msys2 {0}
        env:
          TARGET_NAME: windows-arm64
          HOST_TRIPLET: aarch64-w64-mingw32
          CC: clang
          CXX: clang++
        run: bash scripts/build-windows.sh
      - shell: msys2 {0}
        run: file stage/windows-arm64/bin/*.exe
      - shell: msys2 {0}
        env:
          TARGET_NAME: windows-arm64
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v6
        with:
          name: cdrdao-windows-arm64
          path: dist/*
          if-no-files-found: error
