name: Release cdrdao

on:
  push:
    tags:
      - "cdrdao-*"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml

  release:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          pattern: cdrdao-*
          path: dist
          merge-multiple: true

      - name: Build manifest
        run: python3 scripts/make-manifest.py

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "cdrdao $(cat UPSTREAM_VERSION) for MiSTer Companion" \
            --notes "cdrdao $(cat UPSTREAM_VERSION) builds for MiSTer Companion (Linux and macOS)." \
            dist/*
